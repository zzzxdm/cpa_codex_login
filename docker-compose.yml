services:
  cpa-codex-login:
    build: .
    container_name: cpa-codex-login
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CPA_URL: ${CPA_URL:-http://host.docker.internal:8317}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CPA_VIRTUAL_DISPLAY: "1"
    ports:
      - "8765:8765"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./accounts.txt:/app/accounts.txt
      - ./data:/app/data
