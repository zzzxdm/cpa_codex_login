<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · CPA Codex</title><link rel="stylesheet" href="/style.css"><script src="/remember-password.js" defer></script><script src="/login.js" defer></script></head>
<body class="login-page">
<main class="login-shell"><section class="login-card card">
<div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m12 3 8 4v6c0 4-5 7-8 8-3-1-8-4-8-8V7z"/><path d="m8 12 3 3 5-6"/></svg></span><strong>CPA <span>Codex</span></strong></div>
<div class="eyebrow">ADMIN CONSOLE</div><h1>管理员登录</h1><p class="login-description">登录后管理账号、CPA 凭证与认证任务。</p>
<form id="loginForm"><label for="adminPassword">管理员密码</label><input id="adminPassword" type="password" name="password" autocomplete="current-password" placeholder="输入管理员密码" required autofocus><label class="remember-password"><input id="rememberPassword" type="checkbox">记住密码（仅保存在当前浏览器）</label><p id="loginMessage" role="status" class="login-message" aria-live="polite"></p><button class="button primary login-submit" id="loginSubmit" type="submit">登录</button></form>
<p class="login-note">连续输错 3 次后锁定 1 分钟；再次输错将逐级延长冷却。</p>
</section><p class="login-footer">CPA Codex · 管理员访问</p></main>
</body></html>
